<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <div class="logo-area">
                <i class="fa-brands fa-google-drive fa-xl" style="color:var(--primary);"></i>
                <span>ProExplorer</span>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search in Drive">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="app.toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button class="icon-btn" onclick="app.openTerminal()"><i class="fa-solid fa-terminal"></i></button>
                </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <button class="new-btn" id="btnNew" onclick="showContextMenu(event, null, true)">
                    <i class="fa-solid fa-plus"></i> New
                </button>

                <div class="nav-menu">
                    <div class="nav-header">Drives & Mounts</div>
                    <div id="driveList"></div>
                </div>

                <div class="storage-meter" id="storageMeter">
                    <div class="meter-bar"><div class="fill" id="storageFill" style="width: 0%"></div></div>
                    <span id="storageText">Calculating...</span>
                </div>
            </aside>

            <main class="content-area">
                <div class="tab-strip" id="tabStrip"></div>

                <div class="toolbar">
                    <div class="breadcrumbs" id="breadcrumbs"></div>
                    <div class="view-controls">
                        <button class="icon-btn" onclick="app.refresh()"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                </div>

                <div class="file-area" id="fileArea" oncontextmenu="handleAreaContext(event)">
                    <div class="file-grid" id="fileGrid"></div>
                </div>
            </main>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div id="file-options">
            <div class="ctx-item" onclick="app.ctxAction('open')"><i class="fa-solid fa-folder-open"></i> Open</div>
            <div class="divider"></div>
            <div class="ctx-item" onclick="app.ctxAction('copy')"><i class="fa-solid fa-copy"></i> Copy</div>
            <div class="ctx-item" onclick="app.ctxAction('cut')"><i class="fa-solid fa-scissors"></i> Cut</div>
            <div class="divider"></div>
            <div class="ctx-item" onclick="app.ctxAction('zip')"><i class="fa-solid fa-file-zipper"></i> Add to Zip</div>
            <div class="ctx-item" onclick="app.ctxAction('download')"><i class="fa-solid fa-download"></i> Download</div>
            <div class="divider"></div>
            <div class="ctx-item danger" onclick="app.ctxAction('delete')"><i class="fa-solid fa-trash"></i> Delete</div>
        </div>
        
        <div id="paste-option" style="display:none; border-top:1px solid var(--border);">
             <div class="ctx-item" onclick="app.ctxAction('paste')"><i class="fa-solid fa-paste"></i> Paste Here</div>
        </div>
    </div>

    <div class="context-menu" id="createMenu">
        <div class="ctx-item" onclick="app.create('folder')"><i class="fa-solid fa-folder-plus"></i> New Folder</div>
        <div class="divider"></div>
        <div class="ctx-item" onclick="app.create('file')"><i class="fa-solid fa-file-circle-plus"></i> New Text File</div>
    </div>

    <div class="context-menu" id="tabContextMenu">
        <div class="ctx-item" onclick="app.tabAction('close')"><i class="fa-solid fa-xmark"></i> Close</div>
        <div class="ctx-item" onclick="app.tabAction('close-others')"><i class="fa-solid fa-arrows-left-right-to-line"></i> Close Others</div>
        <div class="divider"></div>
        <div class="ctx-item danger" onclick="app.tabAction('close-all')"><i class="fa-solid fa-bomb"></i> Close All</div>
    </div>

    <div class="terminal-overlay" id="terminalOverlay">
        <div class="term-header">
            <span><i class="fa-solid fa-terminal"></i> Terminal</span>
            <button onclick="document.getElementById('terminalOverlay').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="term-body" id="termOutput">
            <div class="term-line">Welcome to ProExplorer Terminal v1.0</div>
        </div>
        <div class="term-input-area">
            <span class="prompt">$</span>
            <input type="text" id="termInput" autocomplete="off">
        </div>
    </div>

    <div class="media-modal" id="mediaModal">
        <span class="close-modal" onclick="closeMedia()">&times;</span>
        <div class="media-content" id="mediaContainer"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
